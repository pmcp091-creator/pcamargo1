    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Motor de Generación y Descarga de Documentos PDF en Cliente -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script>
      // 1. Immediately unregister any stale service workers or caches that could cause blank screens
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var reg of registrations) {
            reg.unregister();
          }
        }).catch(function(e) {});
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var name of names) {
            caches.delete(name);
          }
        }).catch(function(e) {});
      }

      // 2. Global diagnostics: If any early script fails, display recovery UI instead of blank white
      window.addEventListener('error', function(e) {
        console.error('CRITICAL CLIENT ERROR:', e);
        var root = document.getElementById('root');
        if (root && (!root.firstElementChild || root.querySelector('#initial-loader'))) {
          root.innerHTML = '<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:#090d16; color:#f8fafc; font-family:sans-serif; padding:20px;">' +
            '<div style="max-width:520px; width:100%; background:#131b2e; border:1px solid #1e293b; border-radius:16px; padding:24px; box-shadow:0 25px 50px -12px rgba(0,0,0,0.5); text-align:center;">' +
              '<div style="width:48px; height:48px; border-radius:12px; background:rgba(251,191,36,0.15); color:#fbbf24; border:1px solid rgba(251,191,36,0.3); display:inline-flex; align-items:center; justify-content:center; font-weight:bold; font-size:24px; margin-bottom:16px;">!</div>' +
              '<h2 style="font-size:18px; font-weight:bold; margin:0 0 8px 0; color:#ffffff;">Diagnóstico de Inicialización</h2>' +
              '<p style="font-size:13px; color:#94a3b8; margin:0 0 16px 0;">Se detectó un error al inicializar el entorno local del navegador.</p>' +
              '<div style="background:#090d16; border:1px solid #1e293b; border-radius:8px; padding:12px; font-family:monospace; font-size:12px; color:#fca5a5; text-align:left; word-break:break-all; margin-bottom:20px;">' +
                (e.message || 'Error desconocido') +
              '</div>' +
              '<button onclick="localStorage.clear(); sessionStorage.clear(); if(navigator.serviceWorker){navigator.serviceWorker.getRegistrations().then(function(r){for(var i=0;i<r.length;i++){r[i].unregister();}});} window.location.reload();" style="width:100%; padding:12px; background:#fbbf24; color:#020617; border:none; border-radius:10px; font-weight:bold; font-size:13px; cursor:pointer;">Limpiar Almacenamiento Local y Recargar</button>' +
            '</div>' +
          '</div>';
        }
      });
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased min-h-screen">
    <div id="root">
      <div id="initial-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, -apple-system, sans-serif; background-color: #090d16; color: #f8fafc;">
        <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 20px;">
          <div style="width: 46px; height: 46px; border-radius: 12px; background: #fbbf24; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 22px; color: #020617; box-shadow: 0 8px 20px -4px rgba(251,191,36,0.4);">
            BZ
          </div>
          <div>
            <h1 style="margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -0.02em; color: #ffffff;">Cronograma Vocación que Transforma</h1>
            <p style="margin: 0; font-size: 12px; color: #94a3b8;">The Biz Nation • Uribia, Riohacha y Manaure</p>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: #cbd5e1; background: rgba(255,255,255,0.04); padding: 8px 16px; border-radius: 9999px; border: 1px solid rgba(255,255,255,0.08);">
          <div style="width: 8px; height: 8px; border-radius: 50%; background: #38bdf8;"></div>
          <span>Cargando matriz operativa y sesiones...</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
